services:
  - type: web
    name: xfia-studio-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    initialDeployHook: npm run seed:admin
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_URLS
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: DEPLOYMENT_PROVIDER
        value: multitenant
      - key: PUBLIC_SITE_URL
        sync: false
      - key: PUBLIC_SITE_BASE_DOMAIN
        value: sites.xfiatech.com
      - key: PUBLIC_SITE_SCHEME
        value: https
      - key: DEFAULT_CREATION_FEE
        value: "500"
      - key: DEFAULT_MONTHLY_FEE
        value: "50"
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
